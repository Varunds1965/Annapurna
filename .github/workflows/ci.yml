name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate environment contract
        run: npm run validate-env
        env:
          NODE_ENV: test
          DB_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-only-password

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test
          DB_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-only-password

      - name: Run lint
        run: npm run lint
