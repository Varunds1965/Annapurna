version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Varun121@}
      POSTGRES_DB: thaliplan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: thaliplan
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-Varun121@}
      CORS_ORIGIN: '*'
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # No external credentials needed — calendar is self-contained in DB
    restart: unless-stopped

  setup:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: thaliplan
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-Varun121@}
    command: node src/db/setup.js
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: thaliplan
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-Varun121@}
    command: node src/db/seed.js
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
