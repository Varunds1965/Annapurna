<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thali Plan — Ghar ka khana, delivered</title>
<meta name="description" content="Fresh home-style thalis from local kitchens. Breakfast, lunch and dinner delivered to your door.">
<meta name="theme-color" content="#E85D2A">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#E85D2A;--primary-dark:#C94A1D;--saffron:#F4A825;--leaf:#3E8E5A;--chili:#D64545;
  --bg:#FFF8F0;--surface:#FFFFFF;--surface-2:#FDF1E3;--ink:#2D1B12;--ink-2:#6B5748;--ink-3:#9C8B7D;
  --line:#F0E2D2;--shadow:0 4px 24px rgba(45,27,18,.08);--shadow-lg:0 12px 40px rgba(45,27,18,.14);
  --r:16px;--r-lg:24px;--nav-h:68px;
}
[data-theme="dark"]{
  --bg:#171009;--surface:#211710;--surface-2:#2B1F15;--ink:#F5EDE4;--ink-2:#C9B8A8;--ink-3:#8A7A6B;
  --line:#382A1E;--shadow:0 4px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
img{max-width:100%;display:block}
::selection{background:var(--saffron);color:#2D1B12}
h1,h2,h3,.display{font-family:'Fraunces',serif}

/* ── Nav ── */
.nav{position:sticky;top:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;gap:16px;padding:0 clamp(16px,4vw,48px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--saffron),var(--primary));display:grid;place-items:center;font-size:1.2rem;box-shadow:var(--shadow)}
.nav-search{flex:1;max-width:440px;position:relative;display:none}
@media(min-width:720px){.nav-search{display:block}}
.nav-search input{width:100%;padding:11px 16px 11px 42px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.92rem;outline:none;transition:border .2s,box-shadow .2s}
.nav-search input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 15%,transparent)}
.nav-search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-3)}
.nav-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);transition:transform .15s,border .2s;font-size:1.1rem}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--primary)}
.cart-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--primary);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:all .25s cubic-bezier(.68,-.55,.27,1.55)}
.cart-badge.show{opacity:1;transform:scale(1)}
.user-chip{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-size:.85rem;font-weight:600}
.user-chip .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--leaf),var(--saffron));color:#fff;display:grid;place-items:center;font-size:.75rem;font-weight:800}

/* ── Hero ── */
.hero{position:relative;overflow:hidden;padding:clamp(48px,9vw,110px) clamp(16px,4vw,48px) clamp(40px,7vw,80px);text-align:center}
.hero::before{content:'';position:absolute;inset:-40% -20% auto;height:140%;background:radial-gradient(ellipse at 30% 20%,color-mix(in srgb,var(--saffron) 22%,transparent),transparent 55%),radial-gradient(ellipse at 75% 10%,color-mix(in srgb,var(--primary) 16%,transparent),transparent 50%);pointer-events:none}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-size:.8rem;font-weight:700;color:var(--primary);box-shadow:var(--shadow);animation:fadeUp .6s both}
.hero h1{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:700;letter-spacing:-.03em;margin:20px auto 14px;max-width:14ch;line-height:1.12;animation:fadeUp .6s .08s both}
.hero h1 em{font-style:normal;color:var(--primary);position:relative;white-space:nowrap}
.hero p{color:var(--ink-2);font-size:clamp(1rem,1.6vw,1.15rem);max-width:52ch;margin:0 auto 30px;animation:fadeUp .6s .16s both}
.hero .cta{display:inline-flex;align-items:center;gap:10px;padding:15px 32px;border-radius:99px;background:var(--primary);color:#fff;font-weight:700;font-size:1rem;box-shadow:0 8px 24px color-mix(in srgb,var(--primary) 40%,transparent);transition:transform .15s,box-shadow .2s;animation:fadeUp .6s .24s both}
.hero .cta:hover{transform:translateY(-3px);box-shadow:0 14px 32px color-mix(in srgb,var(--primary) 50%,transparent)}
.float{position:absolute;font-size:clamp(1.6rem,3.5vw,2.6rem);opacity:.85;animation:bob 5s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 6px 12px rgba(45,27,18,.15))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(5deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ── Sections ── */
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
.section-head{display:flex;flex-wrap:wrap;align-items:end;gap:16px;margin:8px 0 22px}
.section-head h2{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.02em}
.section-head p{color:var(--ink-2);font-size:.92rem}
.filters{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.chip{padding:9px 18px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:600;color:var(--ink-2);transition:all .2s}
.chip:hover{border-color:var(--primary)}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ── Kitchen cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;padding-bottom:64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .25s;animation:fadeUp .5s both}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.card .thumb{height:160px;background:linear-gradient(135deg,var(--surface-2),color-mix(in srgb,var(--saffron) 30%,var(--surface-2)));display:grid;place-items:center;font-family:'Fraunces',serif;font-size:2.6rem;font-weight:700;color:var(--primary);position:relative;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .open-pill{position:absolute;top:12px;right:12px;padding:5px 12px;border-radius:99px;font-size:.72rem;font-weight:700;backdrop-filter:blur(8px)}
.open-pill.open{background:rgba(62,142,90,.9);color:#fff}.open-pill.closed{background:rgba(45,27,18,.75);color:#fff}
.card .body{padding:18px 20px 20px}
.card h3{font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.type-dot{width:16px;height:16px;border:2px solid;border-radius:4px;display:grid;place-items:center;flex:none}
.type-dot::after{content:'';width:7px;height:7px;border-radius:50%}
.type-dot.veg{border-color:var(--leaf)}.type-dot.veg::after{background:var(--leaf)}
.type-dot.nonveg{border-color:var(--chili)}.type-dot.nonveg::after{background:var(--chili)}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--ink-2);font-size:.83rem}
.card .addr{margin-top:8px;color:var(--ink-3);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;background:color-mix(in srgb,var(--saffron) 18%,transparent);color:var(--primary-dark);font-weight:700;font-size:.78rem}
[data-theme="dark"] .rating{color:var(--saffron)}

/* ── Skeletons ── */
.skel{border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.skel .sk{background:linear-gradient(90deg,var(--surface-2) 25%,color-mix(in srgb,var(--surface-2) 55%,var(--surface)) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.skel .sk-img{height:160px}.skel .sk-line{height:14px;border-radius:8px;margin:14px 20px 0}.skel .sk-line.short{width:55%;margin-bottom:22px}

/* ── Empty state ── */
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--ink-2)}
.empty .big{font-size:3rem;margin-bottom:12px}

/* ── Kitchen detail ── */
.detail-head{padding:36px 0 8px}
.back-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--primary);margin-bottom:18px}
.detail-title{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.detail-title h2{font-size:clamp(1.7rem,4vw,2.5rem);letter-spacing:-.02em}
.meal-tabs{display:flex;gap:8px;margin:26px 0 20px;overflow-x:auto;padding-bottom:4px}
.meal-tab{padding:11px 22px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:.9rem;white-space:nowrap;transition:all .2s}
.meal-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 35%,transparent)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-bottom:80px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s;animation:fadeUp .4s both}
.dish:hover{box-shadow:var(--shadow)}
.dish-top{display:flex;justify-content:space-between;gap:12px;align-items:start}
.dish h4{font-family:'Plus Jakarta Sans';font-size:1.02rem;font-weight:700}
.dish .desc{color:var(--ink-2);font-size:.84rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nutri{display:flex;flex-wrap:wrap;gap:6px}
.nutri span{padding:3px 10px;border-radius:8px;background:var(--surface-2);font-size:.72rem;font-weight:600;color:var(--ink-2)}
.dish-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.price{font-weight:800;font-size:1.1rem}
.add-btn{padding:9px 22px;border-radius:12px;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-weight:800;font-size:.85rem;border:1.5px solid color-mix(in srgb,var(--primary) 30%,transparent);transition:all .15s}
.add-btn:hover{background:var(--primary);color:#fff}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--primary);border-radius:12px;color:#fff;font-weight:800}
.stepper button{width:34px;height:38px;color:#fff;font-size:1.1rem;font-weight:800}
.stepper .q{min-width:26px;text-align:center;font-size:.9rem}

/* ── Cart drawer ── */
.overlay{position:fixed;inset:0;background:rgba(20,10,5,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);background:var(--bg);z-index:100;transform:translateX(105%);transition:transform .35s cubic-bezier(.32,.72,.31,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.show{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:1.3rem}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px}
.meal-group h5{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:14px 0 8px}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.cart-item .info{flex:1}.cart-item .info b{font-size:.92rem}.cart-item .info small{display:block;color:var(--ink-3)}
.cart-item .stepper{transform:scale(.85);transform-origin:right}
.coupon-row{display:flex;gap:8px;margin:18px 0 6px}
.coupon-row input{flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-transform:uppercase;font-weight:700;letter-spacing:.05em;outline:none}
.coupon-row button{padding:0 20px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700}
.coupon-ok{color:var(--leaf);font-size:.82rem;font-weight:700}
.notes-in{width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;min-height:60px;outline:none;font-size:.88rem}
.pay-opts{display:flex;gap:10px;margin-top:14px}
.pay-opt{flex:1;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:center;font-weight:700;font-size:.88rem;transition:all .2s}
.pay-opt.active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary)}
.totals{padding:16px 22px;border-top:1px solid var(--line);font-size:.92rem}
.totals .row{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-2)}
.totals .row.grand{font-size:1.15rem;font-weight:800;color:var(--ink);padding-top:10px}
.checkout-btn{margin:0 22px 22px;padding:16px;border-radius:16px;background:var(--primary);color:#fff;font-weight:800;font-size:1rem;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 35%,transparent);transition:transform .15s}
.checkout-btn:hover{transform:translateY(-2px)}
.checkout-btn:disabled{opacity:.5;transform:none;cursor:not-allowed}

/* ── Modal ── */
.modal{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:auto}
.modal .box{width:min(420px,100%);background:var(--bg);border-radius:var(--r-lg);padding:30px 28px;box-shadow:var(--shadow-lg);transform:translateY(16px) scale(.97);transition:transform .3s cubic-bezier(.32,.72,.31,1);border:1px solid var(--line)}
.modal.show .box{transform:none}
.modal h3{font-size:1.5rem;margin-bottom:6px}
.modal .sub{color:var(--ink-2);font-size:.9rem;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:6px}
.field input{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.95rem;outline:none;transition:border .2s,box-shadow .2s}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent)}
.otp-boxes{display:flex;gap:9px;justify-content:center;margin:8px 0 4px}
.otp-boxes input{width:46px;height:54px;text-align:center;font-size:1.3rem;font-weight:800;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.otp-boxes input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent)}
.primary-btn{width:100%;padding:15px;border-radius:14px;background:var(--primary);color:#fff;font-weight:800;font-size:.98rem;margin-top:8px;transition:transform .15s}
.primary-btn:hover{transform:translateY(-2px)}
.primary-btn:disabled{opacity:.55;transform:none}
.ghost-link{display:block;text-align:center;margin-top:14px;font-size:.85rem;font-weight:700;color:var(--primary)}

/* ── Order success / tracking ── */
.track-card{max-width:560px;margin:48px auto 90px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:38px 34px;box-shadow:var(--shadow);text-align:center;animation:fadeUp .5s both}
.track-card .tick{width:80px;height:80px;margin:0 auto 18px;border-radius:50%;background:color-mix(in srgb,var(--leaf) 15%,transparent);display:grid;place-items:center;font-size:2.4rem;animation:pop .5s .2s both}
@keyframes pop{from{transform:scale(0)}70%{transform:scale(1.15)}to{transform:scale(1)}}
.track-card h2{font-size:1.8rem;margin-bottom:6px}
.order-id{display:inline-block;margin:10px 0 26px;padding:8px 18px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:.9rem;letter-spacing:.03em}
.timeline{text-align:left;margin:0 auto;max-width:340px}
.tl-step{display:flex;gap:14px;position:relative;padding-bottom:26px}
.tl-step::before{content:'';position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.tl-step:last-child::before{display:none}
.tl-dot{width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.75rem;transition:all .3s;z-index:1}
.tl-step.done .tl-dot{background:var(--leaf);border-color:var(--leaf);color:#fff}
.tl-step.current .tl-dot{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--primary) 20%,transparent);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 22%,transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--primary) 8%,transparent)}}
.tl-step b{display:block;font-size:.94rem}.tl-step small{color:var(--ink-3)}
.live-dot{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:700;color:var(--leaf);margin-bottom:18px}
.live-dot i{width:8px;height:8px;border-radius:50%;background:var(--leaf);animation:pulse 1.6s infinite}

/* ── Toasts ── */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{padding:13px 22px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.9rem;box-shadow:var(--shadow-lg);animation:toastIn .3s both;max-width:90vw}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ── Footer ── */
footer{border-top:1px solid var(--line);padding:36px clamp(16px,4vw,48px);display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;color:var(--ink-3);font-size:.85rem}
footer .logo{font-size:1.05rem}
@media(max-width:600px){.hero{padding-top:40px}.grid{grid-template-columns:1fr}.menu-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="#" onclick="App.goHome();return false"><span class="mark">🍛</span><span>Thali&nbsp;Plan</span></a>
  <div class="nav-search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="search" placeholder="Search kitchens…" oninput="App.renderKitchens()">
  </div>
  <div class="nav-actions">
    <button class="icon-btn" id="themeBtn" title="Toggle theme" onclick="App.toggleTheme()">🌙</button>
    <button class="icon-btn" title="Cart" onclick="App.openCart()">🛒<span class="cart-badge" id="cartBadge">0</span></button>
    <button id="authBtn" class="user-chip" onclick="App.onAuthClick()"><span class="avatar" id="avatarTxt">👋</span><span id="authTxt">Sign in</span></button>
  </div>
</nav>

<main id="view"></main>

<footer>
  <a class="logo" href="#"><span class="mark" style="width:30px;height:30px;font-size:.9rem">🍛</span>Thali Plan</a>
  <span>Fresh, home-style meals from kitchens near you. Made with ❤️</span>
  <span id="year"></span>
</footer>

<!-- Cart drawer -->
<div class="overlay" id="cartOverlay" onclick="App.closeCart()"></div>
<aside class="drawer" id="cartDrawer" aria-label="Cart">
  <div class="drawer-head"><h3>Your Thali 🥘</h3><button class="icon-btn" onclick="App.closeCart()">✕</button></div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="totals" id="cartTotals"></div>
  <button class="checkout-btn" id="checkoutBtn" onclick="App.checkout()">Place order</button>
</aside>

<!-- Auth modal -->
<div class="modal" id="authModal">
  <div class="box">
    <div id="authStep1">
      <h3>Welcome 👋</h3>
      <p class="sub">Sign in with your mobile number. We'll send a one-time password.</p>
      <div class="field"><label>Name</label><input id="inName" placeholder="Your name" autocomplete="name"></div>
      <div class="field"><label>Email (for OTP &amp; receipts)</label><input id="inEmail" type="email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="field"><label>Mobile</label><input id="inMobile" type="tel" maxlength="10" placeholder="10-digit mobile" autocomplete="tel" inputmode="numeric"></div>
      <button class="primary-btn" id="sendOtpBtn" onclick="App.sendOtp()">Send OTP</button>
      <a class="ghost-link" href="#" onclick="App.closeAuth();return false">Not now</a>
    </div>
    <div id="authStep2" style="display:none">
      <h3>Enter OTP 🔐</h3>
      <p class="sub">We sent a 6-digit code to <b id="otpDest"></b></p>
      <div class="otp-boxes" id="otpBoxes">
        <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
      </div>
      <button class="primary-btn" id="verifyBtn" onclick="App.verifyOtp()">Verify &amp; continue</button>
      <a class="ghost-link" href="#" onclick="App.backToStep1();return false">Change number</a>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
'use strict';
const API = '/api';
const MEALS = ['Breakfast','Lunch','Dinner'];
const STATUS_FLOW = [
  {key:'placed', label:'Order placed', icon:'📝'},
  {key:'confirmed', label:'Confirmed by kitchen', icon:'✅'},
  {key:'preparing', label:'Being prepared', icon:'👨‍🍳'},
  {key:'out_for_delivery', label:'Out for delivery', icon:'🛵'},
  {key:'delivered', label:'Delivered — enjoy!', icon:'🎉'},
];

const App = {
  kitchens: [], kitchen: null, filter: 'all', meal: 'Lunch',
  cart: JSON.parse(localStorage.getItem('tp_cart') || '{}'),
  user: JSON.parse(localStorage.getItem('tp_user') || 'null'),
  token: localStorage.getItem('tp_token') || null,
  coupon: null, payMethod: 'upi', pendingCheckout: false,
  activeOrder: JSON.parse(localStorage.getItem('tp_order') || 'null'),
  ws: null,

  /* ── boot ── */
  init() {
    document.getElementById('year').textContent = '© ' + new Date().getFullYear();
    const theme = localStorage.getItem('tp_theme');
    if (theme) document.documentElement.dataset.theme = theme;
    this.syncThemeBtn(); this.syncAuthBtn(); this.updateBadge();
    this.goHome(); this.loadKitchens(); this.connectWS();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
    if (new URLSearchParams(location.search).get('payment') === 'success') this.toast('Payment received — thank you! 🎉');
    this.wireOtpBoxes();
  },

  /* ── theme ── */
  toggleTheme() {
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === 'dark' ? '' : 'dark';
    localStorage.setItem('tp_theme', el.dataset.theme);
    this.syncThemeBtn();
  },
  syncThemeBtn() { document.getElementById('themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'; },

  /* ── data ── */
  async loadKitchens() {
    try {
      const res = await fetch(API + '/kitchens');
      if (!res.ok) throw new Error();
      this.kitchens = await res.json();
    } catch { this.kitchens = null; }
    this.renderKitchens();
  },

  /* ── views ── */
  goHome() {
    this.kitchen = null;
    document.getElementById('view').innerHTML = `
      <section class="hero">
        <span class="float" style="top:16%;left:8%">🥘</span>
        <span class="float" style="top:60%;left:4%;animation-delay:1.2s">🫓</span>
        <span class="float" style="top:22%;right:7%;animation-delay:.6s">🍛</span>
        <span class="float" style="top:64%;right:10%;animation-delay:1.8s">🥗</span>
        <span class="kicker">✦ Freshly cooked, never frozen</span>
        <h1>Ghar ka khana, <em>delivered.</em></h1>
        <p>Order wholesome breakfast, lunch and dinner thalis from trusted local kitchens. Real food, real people, right on time.</p>
        <button class="cta" onclick="document.getElementById('kitchens').scrollIntoView({behavior:'smooth'})">Explore kitchens ↓</button>
      </section>
      ${this.activeOrder ? this.trackerHTML() : ''}
      <div class="wrap" id="kitchens">
        <div class="section-head">
          <div><h2>Kitchens near you</h2><p>Handpicked home kitchens &amp; tiffin services</p></div>
          <div class="filters">
            <button class="chip ${this.filter==='all'?'active':''}" onclick="App.setFilter('all')">All</button>
            <button class="chip ${this.filter==='veg'?'active':''}" onclick="App.setFilter('veg')">🟢 Veg</button>
            <button class="chip ${this.filter==='nonveg'?'active':''}" onclick="App.setFilter('nonveg')">🔴 Non-veg</button>
          </div>
        </div>
        <div class="grid" id="kitchenGrid"></div>
      </div>`;
    this.renderKitchens();
    if (this.activeOrder) this.renderTimeline(this.activeOrder.status);
  },

  setFilter(f) { this.filter = f; this.goHome(); },

  renderKitchens() {
    const grid = document.getElementById('kitchenGrid');
    if (!grid) return;
    if (this.kitchens === null) { grid.innerHTML = `<div class="empty"><div class="big">😕</div><b>Couldn't reach the kitchen network.</b><br>Please check your connection and refresh.</div>`; return; }
    if (!this.kitchens.loaded && this.kitchens.length === 0 && !this._fetched) {
      grid.innerHTML = Array(6).fill('<div class="skel"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>').join('');
      this._fetched = true; return;
    }
    const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
    const list = this.kitchens.filter(k =>
      (this.filter === 'all' || k.type === this.filter) &&
      (!q || k.name.toLowerCase().includes(q) || (k.address||'').toLowerCase().includes(q)));
    if (!list.length) { grid.innerHTML = `<div class="empty"><div class="big">🍽️</div><b>No kitchens found.</b><br>Try a different filter or search.</div>`; return; }
    grid.innerHTML = list.map((k,i) => {
      const open = this.isOpen(k.opening_time, k.closing_time);
      const initial = k.name.trim().charAt(0).toUpperCase();
      return `<article class="card" style="animation-delay:${i*60}ms" onclick="App.openKitchen('${k.id}')">
        <div class="thumb">${k.photo_url ? `<img src="${k.photo_url}" alt="${this.esc(k.name)}" loading="lazy">` : initial}
          <span class="open-pill ${open?'open':'closed'}">${open?'● Open now':'Closed'}</span></div>
        <div class="body">
          <h3><span class="type-dot ${k.type}"></span>${this.esc(k.name)}</h3>
          <div class="meta">${k.rating_text?`<span class="rating">★ ${this.esc(k.rating_text)}</span>`:''}<span>${k.opening_time||'07:00'} – ${k.closing_time||'22:00'}</span></div>
          ${k.address?`<div class="addr">📍 ${this.esc(k.address)}</div>`:''}
        </div></article>`;
    }).join('');
  },

  isOpen(o,c) {
    if (!o || !c) return true;
    const now = new Date(), cur = now.getHours()*60 + now.getMinutes();
    const [oh,om] = o.split(':').map(Number), [ch,cm] = c.split(':').map(Number);
    return cur >= oh*60+om && cur <= ch*60+cm;
  },

  async openKitchen(id) {
    document.getElementById('view').innerHTML = `<div class="wrap detail-head"><div class="grid" style="margin-top:24px">${Array(4).fill('<div class="skel"><div class="sk sk-img" style="height:90px"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>').join('')}</div></div>`;
    window.scrollTo({top:0});
    try {
      const res = await fetch(`${API}/kitchens/${id}`);
      if (!res.ok) throw new Error();
      this.kitchen = await res.json();
    } catch { this.toast('Could not load this kitchen 😞'); this.goHome(); return; }
    this.renderKitchen();
  },

  renderKitchen() {
    const k = this.kitchen;
    const open = this.isOpen(k.opening_time, k.closing_time);
    document.getElementById('view').innerHTML = `
      <div class="wrap detail-head">
        <button class="back-btn" onclick="App.goHome()">← All kitchens</button>
        <div class="detail-title">
          <h2>${this.esc(k.name)}</h2>
          <span class="type-dot ${k.type}" style="width:20px;height:20px"></span>
          ${k.rating_text?`<span class="rating">★ ${this.esc(k.rating_text)}</span>`:''}
          <span class="open-pill ${open?'open':'closed'}" style="position:static">${open?'● Open now':'Closed'}</span>
        </div>
        ${k.address?`<p style="color:var(--ink-2);margin-top:8px">📍 ${this.esc(k.address)}</p>`:''}
        <div class="meal-tabs">${MEALS.map(m=>`<button class="meal-tab ${this.meal===m?'active':''}" onclick="App.setMeal('${m}')">${{Breakfast:'🌅',Lunch:'☀️',Dinner:'🌙'}[m]} ${m}</button>`).join('')}</div>
        <div class="menu-grid" id="menuGrid"></div>
      </div>`;
    this.renderMenu();
  },

  setMeal(m) { this.meal = m; this.renderKitchen(); },

  renderMenu() {
    const grid = document.getElementById('menuGrid');
    const items = (this.kitchen.menu||[]).filter(it => !it.slots || !it.slots.length || it.slots.includes(this.meal));
    if (!items.length) { grid.innerHTML = `<div class="empty"><div class="big">🍳</div><b>No ${this.meal.toLowerCase()} items yet.</b><br>Try another meal slot.</div>`; return; }
    grid.innerHTML = items.map((it,i) => {
      const qty = this.qtyOf(it);
      return `<div class="dish" style="animation-delay:${i*50}ms">
        <div class="dish-top"><div><h4>${this.esc(it.name)}</h4></div>${it.tier?`<span class="nutri"><span>✦ ${this.esc(it.tier)}</span></span>`:''}</div>
        ${it.description?`<p class="desc">${this.esc(it.description)}</p>`:''}
        <div class="nutri">${it.cal?`<span>🔥 ${it.cal} kcal</span>`:''}${it.protein?`<span>💪 ${it.protein}g protein</span>`:''}${(it.tags||[]).slice(0,2).map(t=>`<span>#${this.esc(t)}</span>`).join('')}</div>
        <div class="dish-bottom"><span class="price">₹${parseFloat(it.price).toFixed(0)}</span>
          ${qty ? this.stepperHTML(it, qty) : `<button class="add-btn" onclick='App.addItem(${JSON.stringify({id:it.id,name:it.name,price:parseFloat(it.price)}).replace(/'/g,"&#39;")})'>ADD +</button>`}
        </div></div>`;
    }).join('');
  },

  stepperHTML(it, qty) {
    const payload = JSON.stringify({id:it.id,name:it.name,price:parseFloat(it.price)}).replace(/'/g,'&#39;');
    return `<span class="stepper"><button onclick='App.changeQty(${payload},-1)'>−</button><span class="q">${qty}</span><button onclick='App.changeQty(${payload},1)'>+</button></span>`;
  },

  /* ── cart ── */
  cartKey(it) { return `${this.kitchen?this.kitchen.id:this._ck}|${this.meal}|${it.id||it.name}`; },
  qtyOf(it) { const e = this.cart[this.cartKey(it)]; return e ? e.qty : 0; },
  addItem(it) {
    const k = this.cartKey(it);
    this.cart[k] = { ...it, meal: this.meal, kitchenId: this.kitchen.id, kitchenName: this.kitchen.name, qty: 1 };
    this.saveCart(); this.renderMenu(); this.toast(`${it.name} added to ${this.meal} 🧺`);
  },
  changeQty(it, d) {
    const k = this.cartKey(it), e = this.cart[k];
    if (!e) return;
    e.qty += d;
    if (e.qty <= 0) delete this.cart[k];
    this.saveCart();
    if (document.getElementById('menuGrid')) this.renderMenu();
    if (document.getElementById('cartDrawer').classList.contains('show')) this.renderCart();
  },
  changeQtyByKey(key, d) {
    const e = this.cart[key]; if (!e) return;
    e.qty += d; if (e.qty <= 0) delete this.cart[key];
    this.saveCart(); this.renderCart();
    if (document.getElementById('menuGrid')) this.renderMenu();
  },
  saveCart() { localStorage.setItem('tp_cart', JSON.stringify(this.cart)); this.updateBadge(); },
  updateBadge() {
    const n = Object.values(this.cart).reduce((s,e)=>s+e.qty,0);
    const b = document.getElementById('cartBadge');
    b.textContent = n; b.classList.toggle('show', n>0);
  },
  subtotal() { return Object.values(this.cart).reduce((s,e)=>s+e.qty*e.price,0); },

  openCart() { this.renderCart(); document.getElementById('cartOverlay').classList.add('show'); document.getElementById('cartDrawer').classList.add('show'); },
  closeCart() { document.getElementById('cartOverlay').classList.remove('show'); document.getElementById('cartDrawer').classList.remove('show'); },

  renderCart() {
    const body = document.getElementById('cartBody'), entries = Object.entries(this.cart);
    if (!entries.length) {
      body.innerHTML = `<div class="empty"><div class="big">🧺</div><b>Your thali is empty.</b><br>Add some delicious food first!</div>`;
      document.getElementById('cartTotals').innerHTML = '';
      document.getElementById('checkoutBtn').disabled = true; return;
    }
    document.getElementById('checkoutBtn').disabled = false;
    const byMeal = {};
    entries.forEach(([key,e]) => { (byMeal[e.meal] = byMeal[e.meal]||[]).push([key,e]); });
    body.innerHTML = MEALS.filter(m=>byMeal[m]).map(m => `
      <div class="meal-group"><h5>${{Breakfast:'🌅',Lunch:'☀️',Dinner:'🌙'}[m]} ${m}</h5>
      ${byMeal[m].map(([key,e]) => `<div class="cart-item">
        <div class="info"><b>${this.esc(e.name)}</b><small>${this.esc(e.kitchenName)} · ₹${e.price.toFixed(0)} each</small></div>
        <span class="stepper"><button onclick="App.changeQtyByKey('${key.replace(/'/g,"\\'")}',-1)">−</button><span class="q">${e.qty}</span><button onclick="App.changeQtyByKey('${key.replace(/'/g,"\\'")}',1)">+</button></span>
      </div>`).join('')}</div>`).join('') + `
      <div class="coupon-row"><input id="couponIn" placeholder="COUPON CODE" value="${this.coupon?this.coupon.code:''}"><button onclick="App.applyCoupon()">Apply</button></div>
      <div id="couponMsg">${this.coupon?`<span class="coupon-ok">✓ ${this.esc(this.coupon.code)} applied — you save ₹${this.coupon.discount.toFixed(0)}</span>`:''}</div>
      <textarea class="notes-in" id="orderNotes" placeholder="Cooking notes? (less spicy, no onion…)"></textarea>
      <div class="pay-opts">
        <button class="pay-opt ${this.payMethod==='upi'?'active':''}" onclick="App.setPay('upi')">📱 UPI</button>
        <button class="pay-opt ${this.payMethod==='cod'?'active':''}" onclick="App.setPay('cod')">💵 Cash on delivery</button>
      </div>`;
    this.renderTotals();
  },
  setPay(m) { this.payMethod = m; this.renderCart(); },
  renderTotals() {
    const sub = this.subtotal(), disc = this.coupon ? Math.min(this.coupon.discount, sub) : 0;
    document.getElementById('cartTotals').innerHTML = `
      <div class="row"><span>Subtotal</span><span>₹${sub.toFixed(0)}</span></div>
      ${disc?`<div class="row" style="color:var(--leaf)"><span>Coupon discount</span><span>−₹${disc.toFixed(0)}</span></div>`:''}
      <div class="row grand"><span>Total</span><span>₹${(sub-disc).toFixed(0)}</span></div>`;
  },
  async applyCoupon() {
    const code = document.getElementById('couponIn').value.trim();
    if (!code) return;
    try {
      const res = await fetch(API + '/coupons/validate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code, orderTotal: this.subtotal() }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Invalid coupon');
      this.coupon = data.coupon;
      this.toast(`Coupon applied — saved ₹${data.coupon.discount.toFixed(0)} 🎉`);
    } catch (e) { this.coupon = null; this.toast(e.message); }
    this.renderCart();
  },

  /* ── auth ── */
  syncAuthBtn() {
    if (this.user) {
      document.getElementById('authTxt').textContent = this.user.name.split(' ')[0];
      document.getElementById('avatarTxt').textContent = this.user.name.trim().charAt(0).toUpperCase();
    } else {
      document.getElementById('authTxt').textContent = 'Sign in';
      document.getElementById('avatarTxt').textContent = '👋';
    }
  },
  onAuthClick() {
    if (!this.user) return this.openAuth();
    if (confirm(`Signed in as ${this.user.name} (${this.user.mobile}).\n\nSign out?`)) {
      this.user = null; this.token = null;
      localStorage.removeItem('tp_user'); localStorage.removeItem('tp_token');
      this.syncAuthBtn(); this.toast('Signed out. See you soon! 👋');
    }
  },
  openAuth() { document.getElementById('authModal').classList.add('show'); this.backToStep1(); },
  closeAuth() { document.getElementById('authModal').classList.remove('show'); this.pendingCheckout = false; },
  backToStep1() { document.getElementById('authStep1').style.display=''; document.getElementById('authStep2').style.display='none'; },
  async sendOtp() {
    const mobile = document.getElementById('inMobile').value.trim();
    const name = document.getElementById('inName').value.trim();
    const email = document.getElementById('inEmail').value.trim();
    if (!/^[6-9]\d{9}$/.test(mobile)) return this.toast('Enter a valid 10-digit mobile number');
    const btn = document.getElementById('sendOtpBtn'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const res = await fetch(API + '/auth/send-otp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mobile, name, email }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not send OTP');
      this._mobile = mobile;
      document.getElementById('otpDest').textContent = email || mobile;
      document.getElementById('authStep1').style.display='none';
      document.getElementById('authStep2').style.display='';
      document.querySelector('#otpBoxes input').focus();
      this.toast('OTP sent! 📬');
    } catch (e) { this.toast(e.message); }
    btn.disabled = false; btn.textContent = 'Send OTP';
  },
  wireOtpBoxes() {
    const boxes = [...document.querySelectorAll('#otpBoxes input')];
    boxes.forEach((b,i) => {
      b.addEventListener('input', () => { b.value = b.value.replace(/\D/g,''); if (b.value && boxes[i+1]) boxes[i+1].focus(); });
      b.addEventListener('keydown', e => { if (e.key==='Backspace' && !b.value && boxes[i-1]) boxes[i-1].focus(); });
      b.addEventListener('paste', e => {
        const t = (e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);
        if (t.length) { e.preventDefault(); t.split('').forEach((c,j)=>{ if(boxes[j]) boxes[j].value=c; }); boxes[Math.min(t.length,5)].focus(); }
      });
    });
  },
  async verifyOtp() {
    const otp = [...document.querySelectorAll('#otpBoxes input')].map(b=>b.value).join('');
    if (otp.length < 6) return this.toast('Enter the full 6-digit OTP');
    const btn = document.getElementById('verifyBtn'); btn.disabled = true; btn.textContent = 'Verifying…';
    try {
      const res = await fetch(API + '/auth/verify-otp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mobile: this._mobile, otp }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Invalid OTP');
      this.token = data.token || null;
      this.user = data.customer ? { name: data.customer.name, email: data.customer.email, mobile: data.customer.mobile } : { name: document.getElementById('inName').value.trim() || 'Guest', email: document.getElementById('inEmail').value.trim(), mobile: this._mobile };
      if (this.token) localStorage.setItem('tp_token', this.token);
      localStorage.setItem('tp_user', JSON.stringify(this.user));
      this.syncAuthBtn(); this.closeAuth(); this.toast(`Welcome, ${this.user.name.split(' ')[0]}! 🙏`);
      if (this.pendingCheckout) { this.pendingCheckout = false; this.checkout(); }
    } catch (e) { this.toast(e.message); }
    btn.disabled = false; btn.textContent = 'Verify & continue';
  },

  /* ── checkout ── */
  async checkout() {
    const entries = Object.values(this.cart);
    if (!entries.length) return;
    if (!this.user) { this.pendingCheckout = true; this.closeCart(); return this.openAuth(); }
    const kitchenIds = [...new Set(entries.map(e=>e.kitchenId))];
    if (kitchenIds.length > 1) return this.toast('Please order from one kitchen at a time 🙏');
    const itemsByMeal = {};
    entries.forEach(e => { (itemsByMeal[e.meal] = itemsByMeal[e.meal]||[]).push({ id:e.id, name:e.name, price:e.price, qty:e.qty }); });
    const sub = this.subtotal(), disc = this.coupon ? Math.min(this.coupon.discount, sub) : 0, total = sub - disc;
    const notes = document.getElementById('orderNotes')?.value || '';
    const btn = document.getElementById('checkoutBtn'); btn.disabled = true; btn.textContent = 'Placing order…';
    try {
      const res = await fetch(API + '/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
        customerName: this.user.name, customerEmail: this.user.email, customerMobile: this.user.mobile,
        kitchenId: kitchenIds[0], itemsByMeal, total, paymentMethod: this.payMethod, notes: notes + (this.coupon?` [coupon:${this.coupon.code}]`:'') }) });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Order failed');
      this.activeOrder = { id: data.orderId, status: 'placed', total, kitchenName: entries[0].kitchenName };
      localStorage.setItem('tp_order', JSON.stringify(this.activeOrder));
      this.cart = {}; this.coupon = null; this.saveCart(); this.closeCart();
      if (this.payMethod === 'upi') {
        try {
          const pRes = await fetch(API + '/payments/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ amount: total, orderId: data.orderId, customerName: this.user.name, customerMobile: this.user.mobile }) });
          const pay = await pRes.json();
          const url = pay.redirectUrl || pay.paymentUrl || pay.url || (pay.data && pay.data.instrumentResponse && pay.data.instrumentResponse.redirectInfo && pay.data.instrumentResponse.redirectInfo.url);
          if (url) { window.location.href = url; return; }
        } catch { /* fall through to tracking */ }
      }
      this.goHome(); window.scrollTo({top:0,behavior:'smooth'}); this.toast('Order placed! 🎉');
    } catch (e) { this.toast(e.message); }
    btn.disabled = false; btn.textContent = 'Place order';
  },

  /* ── live tracking ── */
  trackerHTML() {
    const o = this.activeOrder;
    return `<div class="wrap"><div class="track-card">
      <div class="tick">🍛</div>
      <h2>Your order is on its way</h2>
      <p style="color:var(--ink-2)">from <b>${this.esc(o.kitchenName||'the kitchen')}</b> · ₹${(o.total||0).toFixed(0)}</p>
      <span class="order-id">#${this.esc(o.id)}</span>
      <div class="live-dot"><i></i> Live updates</div>
      <div class="timeline" id="timeline"></div>
      <a class="ghost-link" href="#" onclick="App.dismissOrder();return false">Dismiss</a>
    </div></div>`;
  },
  renderTimeline(status) {
    const el = document.getElementById('timeline'); if (!el) return;
    if (status === 'cancelled') { el.innerHTML = `<div class="empty" style="padding:20px"><div class="big">😔</div><b>This order was cancelled.</b></div>`; return; }
    const idx = STATUS_FLOW.findIndex(s=>s.key===status);
    el.innerHTML = STATUS_FLOW.map((s,i) => `<div class="tl-step ${i<idx?'done':i===idx?'current':''}"><div class="tl-dot">${i<idx?'✓':s.icon}</div><div><b>${s.label}</b><small>${i===idx?'Happening now':i<idx?'Done':'Up next'}</small></div></div>`).join('');
  },
  dismissOrder() { this.activeOrder = null; localStorage.removeItem('tp_order'); this.goHome(); },

  connectWS() {
    try {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      this.ws = new WebSocket(`${proto}://${location.host}/ws`);
      this.ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        const order = msg.order || msg.data || msg;
        const oid = order.id || order.orderId, status = order.status || msg.status;
        if (this.activeOrder && oid === this.activeOrder.id && status) {
          this.activeOrder.status = status;
          localStorage.setItem('tp_order', JSON.stringify(this.activeOrder));
          this.renderTimeline(status);
          const st = STATUS_FLOW.find(s=>s.key===status);
          if (st) this.toast(`${st.icon} ${st.label}`);
          if (status === 'delivered') setTimeout(()=>this.dismissOrder(), 30000);
        }
      };
      this.ws.onclose = () => setTimeout(()=>this.connectWS(), 5000);
    } catch { /* ws optional */ }
  },

  /* ── utils ── */
  toast(text) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
    document.getElementById('toasts').appendChild(t);
    setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3200);
  },
  esc(s) { return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },
};

App.init();
</script>
</body>
</html>
