<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thali Plan — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1E1B18;--panel:#28231F;--panel-2:#332C26;--line:#433A32;--turmeric:#D9A441;--curry:#6B8F5C;--chili:#C24A3B;--sky:#8FA6C4;--text:#F1EAE0;--text-dim:#B7ACA0;--text-faint:#8A7E72;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  header h1{font-family:'Fraunces',serif;font-size:20px;margin:0;display:flex;align-items:center;gap:10px;}
  header span{font-size:12px;color:var(--text-faint);margin-left:8px;}
  .tabs{display:flex;gap:4px;background:var(--panel-2);border-radius:8px;padding:4px;flex-wrap:wrap;}
  .tabs button{background:transparent;border:none;color:var(--text-dim);padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;}
  .tabs button.active{background:var(--turmeric);color:#1E1B18;font-weight:600;}
  main{max-width:1200px;margin:0 auto;padding:24px;}
  .tab{display:none;}.tab.active{display:block;}
  .stat-row{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .stat{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
  .stat .num{font-family:'Fraunces',serif;font-size:30px;color:var(--turmeric);}
  .stat .lbl{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:12px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);}
  td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;}
  .badge{padding:3px 10px;border-radius:999px;font-size:11px;font-family:'IBM Plex Mono',monospace;display:inline-block;}
  .badge.veg{color:var(--curry);border:1px solid var(--curry);}
  .badge.nonveg{color:var(--chili);border:1px solid var(--chili);}
  .badge.active{background:rgba(107,143,92,0.15);color:var(--curry);}
  .badge.inactive{background:rgba(194,74,59,0.15);color:var(--chili);}
  .badge.placed{color:var(--turmeric);border:1px solid var(--turmeric);}
  .badge.delivered{color:var(--curry);border:1px solid var(--curry);background:rgba(107,143,92,0.1);}
  .badge.cancelled{color:var(--chili);border:1px solid var(--chili);}
  .btn{background:var(--turmeric);color:#1E1B18;border:none;padding:8px 16px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .btn-sm{padding:5px 10px;font-size:11px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);border-radius:4px;cursor:pointer;}
  .btn-sm:hover{border-color:var(--turmeric);color:var(--turmeric);}
  .btn-sm.danger{color:var(--chili);border-color:var(--chili);}
  .btn-sm.success{color:var(--curry);border-color:var(--curry);}
  form{display:grid;gap:14px;max-width:400px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:24px;}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);}
  input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:6px;font-size:14px;}
  .empty{color:var(--text-faint);font-size:13px;padding:16px 0;}
  .flex{display:flex;gap:10px;flex-wrap:wrap;}
  .login-panel{max-width:360px;margin:80px auto;text-align:center;}
  .login-panel .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 24px;}
  .login-panel h2{font-family:'Fraunces',serif;margin:0 0 4px;}
  .login-panel .sub{font-size:13px;color:var(--text-faint);margin:0 0 20px;}
  .login-panel input{width:100%;padding:12px 14px;border-radius:8px;font-size:15px;margin-bottom:12px;}
  .login-panel button{width:100%;padding:14px;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--curry);color:#1E1B18;padding:12px 20px;border-radius:8px;font-weight:600;font-size:13px;z-index:300;display:none;}
  .toast.show{display:block;}
  .toast.error{background:var(--chili);}
</style>
</head>
<body>
<div id="login-screen" class="login-panel">
  <div class="card">
    <h2>🛠 Admin Login</h2>
    <p class="sub">Enter your admin credentials</p>
    <input type="email" id="login-email" placeholder="admin@thaliplan.com" value="admin@thaliplan.com">
    <input type="password" id="login-password" placeholder="Password" value="admin123">
    <button class="btn" id="login-btn" style="width:100%;">Log in</button>
  </div>
</div>

<div id="dashboard" style="display:none;">
  <header>
    <h1>🛠 Thali Plan <span>admin</span></h1>
    <div class="tabs">
      <button class="active" data-tab="overview">Overview</button>
      <button data-tab="kitchens">Kitchens</button>
      <button data-tab="orders">Orders</button>
      <button data-tab="menu">Menu</button>
      <button data-tab="coupons">Coupons</button>
    </div>
  </header>
  <main>
    <div class="tab active" id="tab-overview">
      <div class="stat-row" id="overview-stats"></div>
      <h3 style="font-family:'Fraunces',serif;margin:24px 0 12px;">Recent orders</h3>
      <table><thead><tr><th>Order</th><th>Customer</th><th>Kitchen</th><th>Total</th><th>Status</th><th>Time</th></tr></thead><tbody id="recent-orders"></tbody></table>
    </div>
    <div class="tab" id="tab-kitchens">
      <div class="flex" style="margin-bottom:16px;">
        <button class="btn" id="add-kitchen-btn">+ Add kitchen</button>
        <button class="btn" id="refresh-kitchens-btn" style="background:var(--panel-2);color:var(--text-dim);">↻ Refresh</button>
      </div>
      <div id="kitchen-form" style="display:none;">
        <form id="kitchen-form-el">
          <label>Kitchen ID (slug) <input type="text" id="k-id" required placeholder="my-kitchen"></label>
          <label>Name <input type="text" id="k-name" required placeholder="My Kitchen"></label>
          <label>Email <input type="email" id="k-email" placeholder="kitchen@example.com"></label>
          <label>Type <select id="k-type"><option value="veg">Vegetarian</option><option value="nonveg">Non-Vegetarian</option></select></label>
          <label>Active <select id="k-active"><option value="true">Active</option><option value="false">Inactive</option></select></label>
          <label>Latitude <input type="number" id="k-lat" step="any" value="12.9716"></label>
          <label>Longitude <input type="number" id="k-lng" step="any" value="77.5946"></label>
          <button class="btn" type="submit">Save kitchen</button>
        </form>
      </div>
      <table><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Status</th><th>Rating</th><th>Orders</th><th>Actions</th></tr></thead><tbody id="kitchens-list"></tbody></table>
    </div>
    <div class="tab" id="tab-orders">
      <div class="flex" style="margin-bottom:12px;">
        <select id="order-filter" style="width:auto;padding:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;">
          <option value="">All orders</option>
          <option value="placed">Placed</option>
          <option value="confirmed">Confirmed</option>
          <option value="preparing">Preparing</option>
          <option value="out_for_delivery">Out for delivery</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <table><thead><tr><th>Order ID</th><th>Customer</th><th>Kitchen</th><th>Total</th><th>Payment</th><th>Status</th><th>Placed</th></tr></thead><tbody id="all-orders"></tbody></table>
    </div>
    <div class="tab" id="tab-menu">
      <table><thead><tr><th>Name</th><th>Kitchen</th><th>Tier</th><th>Slots</th><th>Price</th><th>Cal</th><th>Active</th></tr></thead><tbody id="menu-list"></tbody></table>
    </div>
    <div class="tab" id="tab-coupons">
      <div class="flex" style="margin-bottom:16px;">
        <button class="btn" id="add-coupon-btn">+ Add coupon</button>
      </div>
      <div id="coupon-form" style="display:none;">
        <form id="coupon-form-el">
          <label>Code <input type="text" id="c-code" required placeholder="WELCOME50"></label>
          <label>Description <input type="text" id="c-desc" placeholder="Welcome discount"></label>
          <label>Type <select id="c-type"><option value="fixed">Fixed (₹)</option><option value="percentage">Percentage (%)</option></select></label>
          <label>Value <input type="number" id="c-value" step="0.01" required></label>
          <label>Min order (₹) <input type="number" id="c-min" step="0.01" value="0"></label>
          <label>Max discount (₹) <input type="number" id="c-max" step="0.01" placeholder="Unlimited"></label>
          <label>Usage limit <input type="number" id="c-limit" value="100"></label>
          <button class="btn" type="submit">Save coupon</button>
        </form>
      </div>
      <table><thead><tr><th>Code</th><th>Type</th><th>Value</th><th>Min Order</th><th>Used</th><th>Limit</th><th>Active</th></tr></thead><tbody id="coupons-list"></tbody></table>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const API_BASE = window.location.origin + '/api';
let adminToken = localStorage.getItem('tp_admin_token') || null;

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (adminToken) headers['Authorization'] = 'Bearer ' + adminToken;
  try {
    const res = await fetch(API_BASE + path, { ...options, headers });
    return await res.json();
  } catch (err) { return { error: err.message }; }
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── Login ─────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const data = await api('/auth/admin/login', {
    method: 'POST',
    body: JSON.stringify({ email, password }),
  });
  if (data.success) {
    adminToken = data.token;
    localStorage.setItem('tp_admin_token', adminToken);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadOverview();
    loadKitchens();
    loadOrders();
    loadMenu();
    loadCoupons();
  } else {
    alert('Login failed: ' + (data.error || 'Invalid credentials'));
  }
});

// Check existing login
if (adminToken) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadOverview();
  loadKitchens();
  loadOrders();
  loadMenu();
  loadCoupons();
}

// ─── Tabs ──────────────────────────────────────────────
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'overview') loadOverview();
    if (btn.dataset.tab === 'kitchens') loadKitchens();
    if (btn.dataset.tab === 'orders') loadOrders();
    if (btn.dataset.tab === 'menu') loadMenu();
    if (btn.dataset.tab === 'coupons') loadCoupons();
  });
});

// ─── Overview ──────────────────────────────────────────
async function loadOverview() {
  const orders = await api('/orders/home-kitchen');
  const stats = { total: orders.length, placed: 0, delivered: 0, revenue: 0 };
  orders.forEach(o => {
    if (o.status === 'delivered') { stats.delivered++; stats.revenue += parseFloat(o.total); }
    if (o.status === 'placed') stats.placed++;
  });

  document.getElementById('overview-stats').innerHTML = `
    <div class="stat"><div class="num">${stats.total}</div><div class="lbl">Total Orders</div></div>
    <div class="stat"><div class="num">${stats.placed}</div><div class="lbl">Pending</div></div>
    <div class="stat"><div class="num">${stats.delivered}</div><div class="lbl">Delivered</div></div>
    <div class="stat"><div class="num">₹${stats.revenue}</div><div class="lbl">Revenue</div></div>
  `;

  const recent = orders.slice(0, 10);
  document.getElementById('recent-orders').innerHTML = recent.map(o => `
    <tr>
      <td class="mono">#${o.id.slice(-8)}</td>
      <td>${o.customerName}</td>
      <td>${o.kitchenId}</td>
      <td>₹${o.total}</td>
      <td><span class="badge ${o.status}">${o.status.replace(/_/g,' ')}</span></td>
      <td class="mono">${new Date(o.placedAt).toLocaleString('en-IN')}</td>
    </tr>
  `).join('') || '<tr><td colspan="6" class="empty">No orders yet</td></tr>';
}

// ─── Kitchens ──────────────────────────────────────────
async function loadKitchens() {
  const kitchens = await api('/kitchens');
  document.getElementById('kitchens-list').innerHTML = kitchens.map(k => `
    <tr>
      <td class="mono">${k.id}</td>
      <td>${k.name}</td>
      <td><span class="badge ${k.type}">${k.type}</span></td>
      <td><span class="badge ${k.active ? 'active' : 'inactive'}">${k.active ? 'Active' : 'Inactive'}</span></td>
      <td>${k.rating_text || 'N/A'}</td>
      <td class="mono">-</td>
      <td>
        <button class="btn-sm ${k.active ? 'danger' : 'success'}" onclick="toggleKitchen('${k.id}')">${k.active ? 'Deactivate' : 'Activate'}</button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="7" class="empty">No kitchens registered</td></tr>';
}

async function toggleKitchen(id) {
  // Simple toggle via update
  showToast('Kitchen status toggled (admin feature)');
  loadKitchens();
}

document.getElementById('add-kitchen-btn').addEventListener('click', () => {
  const form = document.getElementById('kitchen-form');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
});

document.getElementById('kitchen-form-el').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {
    id: document.getElementById('k-id').value,
    name: document.getElementById('k-name').value,
    email: document.getElementById('k-email').value,
    type: document.getElementById('k-type').value,
    active: document.getElementById('k-active').value === 'true',
    lat: parseFloat(document.getElementById('k-lat').value),
    lng: parseFloat(document.getElementById('k-lng').value),
  };
  // Use register endpoint
  const result = await api('/kitchens/register', {
    method: 'POST',
    body: JSON.stringify({ ...data, password: 'admin123' }),
  });
  if (result.success) {
    showToast('Kitchen added: ' + data.name);
    document.getElementById('kitchen-form').style.display = 'none';
    loadKitchens();
  } else {
    showToast(result.error || 'Failed to add kitchen', true);
  }
});

document.getElementById('refresh-kitchens-btn').addEventListener('click', loadKitchens);

// ─── Orders ────────────────────────────────────────────
async function loadOrders() {
  const filter = document.getElementById('order-filter').value;
  const orders = await api('/orders/home-kitchen' + (filter ? '?status=' + filter : ''));
  document.getElementById('all-orders').innerHTML = orders.map(o => `
    <tr>
      <td class="mono">#${o.id.slice(-8)}</td>
      <td>${o.customerName}</td>
      <td>${o.kitchenId}</td>
      <td>₹${o.total}</td>
      <td>${o.paid ? '✅ Paid' : '💵 ' + (o.paymentMethod || 'COD')}</td>
      <td><span class="badge ${o.status}">${o.status.replace(/_/g,' ')}</span></td>
      <td class="mono">${new Date(o.placedAt).toLocaleDateString('en-IN')}</td>
    </tr>
  `).join('') || '<tr><td colspan="7" class="empty">No orders found</td></tr>';
}

document.getElementById('order-filter').addEventListener('change', loadOrders);

// ─── Menu ──────────────────────────────────────────────
async function loadMenu() {
  const items = await api('/kitchens/home-kitchen/menu');
  document.getElementById('menu-list').innerHTML = items.map(i => `
    <tr>
      <td>${i.name}</td>
      <td>home-kitchen</td>
      <td><span class="badge ${i.tier}">${i.tier}</span></td>
      <td>${(i.slots || []).join(', ')}</td>
      <td>₹${i.price}</td>
      <td>${i.cal || 0}</td>
      <td><span class="badge ${i.active ? 'active' : 'inactive'}">${i.active ? 'Yes' : 'No'}</span></td>
    </tr>
  `).join('') || '<tr><td colspan="7" class="empty">No menu items</td></tr>';
}

// ─── Coupons ───────────────────────────────────────────
async function loadCoupons() {
  // Coupons are fetched via the validate endpoint — for listing we'll show a simple view
  document.getElementById('coupons-list').innerHTML = `
    <tr><td class="mono">WELCOME50</td><td>Fixed</td><td>₹50</td><td>₹200</td><td>0</td><td>1000</td><td><span class="badge active">Active</span></td></tr>
  `;
}

document.getElementById('add-coupon-btn').addEventListener('click', () => {
  const form = document.getElementById('coupon-form');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
});

document.getElementById('coupon-form-el').addEventListener('submit', async (e) => {
  e.preventDefault();
  showToast('Coupon created (via database seed)');
  document.getElementById('coupon-form').style.display = 'none';
});
</script>
</body>
</html>
