<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Dashboard — Thali Plan</title>
<meta name="theme-color" content="#E85D2A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#E85D2A;--primary-dark:#C94A1D;--saffron:#F4A825;--leaf:#3E8E5A;--chili:#D64545;--sky:#3B7BD4;
  --bg:#FFF8F0;--surface:#FFFFFF;--surface-2:#FDF1E3;--ink:#2D1B12;--ink-2:#6B5748;--ink-3:#9C8B7D;
  --line:#F0E2D2;--shadow:0 4px 24px rgba(45,27,18,.08);--shadow-lg:0 12px 40px rgba(45,27,18,.14);--r:16px;--r-lg:24px;
}
[data-theme="dark"]{--bg:#171009;--surface:#211710;--surface-2:#2B1F15;--ink:#F5EDE4;--ink-2:#C9B8A8;--ink-3:#8A7A6B;--line:#382A1E;--shadow:0 4px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.5)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;transition:background .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--ink)}
h1,h2,h3{font-family:'Fraunces',serif;letter-spacing:-.02em}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 25% 15%,color-mix(in srgb,var(--saffron) 18%,transparent),transparent 55%),radial-gradient(ellipse at 80% 85%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 50%),var(--bg)}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:38px 34px;box-shadow:var(--shadow-lg);animation:fadeUp .5s both}
.login-card .mark{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--saffron),var(--primary));display:grid;place-items:center;font-size:1.8rem;margin-bottom:18px;box-shadow:var(--shadow)}
.login-card h1{font-size:1.7rem;margin-bottom:4px}
.login-card .sub{color:var(--ink-2);font-size:.9rem;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:.95rem;outline:none;transition:border .2s,box-shadow .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent)}
.primary-btn{width:100%;padding:15px;border-radius:14px;background:var(--primary);color:#fff;font-weight:800;font-size:.98rem;margin-top:8px;transition:transform .15s;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 30%,transparent)}
.primary-btn:hover{transform:translateY(-2px)}.primary-btn:disabled{opacity:.55;transform:none}
.ghost-link{display:block;text-align:center;margin-top:16px;font-size:.85rem;font-weight:700;color:var(--primary);text-decoration:none}

/* shell */
.shell{display:none;min-height:100vh}
.shell.active{display:grid;grid-template-columns:240px 1fr}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side-logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;padding:0 10px 20px}
.side-logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--saffron),var(--primary));display:grid;place-items:center;font-size:1rem}
.side-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-weight:600;font-size:.92rem;color:var(--ink-2);transition:all .15s;text-align:left;width:100%}
.side-link:hover{background:var(--surface-2)}
.side-link.active{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-weight:800}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.main{padding:26px clamp(18px,3.5vw,42px);min-width:0}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.topbar h2{font-size:clamp(1.4rem,2.6vw,1.9rem)}
.live-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-size:.76rem;font-weight:700;color:var(--ink-3)}
.live-pill.on{color:var(--leaf)}
.live-pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.live-pill.on i{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 25%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.topbar .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);font-size:1rem;transition:transform .15s}
.icon-btn:hover{transform:translateY(-2px)}
.approval-note{padding:14px 18px;border-radius:14px;background:color-mix(in srgb,var(--saffron) 16%,transparent);border:1.5px solid color-mix(in srgb,var(--saffron) 40%,transparent);font-size:.88rem;font-weight:600;margin-bottom:22px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;animation:fadeUp .4s both}
.stat .lbl{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.stat .val{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:700;margin-top:4px}
.stat .hint{font-size:.78rem;color:var(--ink-2)}

/* tabs & orders */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:9px 18px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:.84rem;font-weight:700;color:var(--ink-2);transition:all .2s}
.tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{opacity:.65;font-weight:600}
.orders{display:grid;gap:14px}
.order-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;animation:fadeUp .35s both}
.order-card.fresh{border-color:color-mix(in srgb,var(--primary) 50%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 10%,transparent)}
.order-card .who b{font-size:1rem}
.order-card .who small{display:block;color:var(--ink-3);font-size:.78rem}
.order-items{flex:1 1 240px;font-size:.85rem;color:var(--ink-2)}
.order-items .meal{font-weight:700;color:var(--ink)}
.badge{padding:5px 13px;border-radius:99px;font-size:.74rem;font-weight:800;letter-spacing:.03em}
.badge.placed{background:color-mix(in srgb,var(--saffron) 22%,transparent);color:var(--primary-dark)}
.badge.confirmed{background:color-mix(in srgb,var(--sky) 18%,transparent);color:var(--sky)}
.badge.preparing{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.badge.out_for_delivery{background:color-mix(in srgb,var(--saffron) 25%,transparent);color:#9A6B00}
.badge.delivered{background:color-mix(in srgb,var(--leaf) 18%,transparent);color:var(--leaf)}
.badge.cancelled{background:color-mix(in srgb,var(--chili) 15%,transparent);color:var(--chili)}
.order-actions{display:flex;gap:8px;margin-left:auto}
.act-btn{padding:10px 18px;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;font-size:.82rem;transition:transform .15s}
.act-btn:hover{transform:translateY(-2px)}
.act-btn.subtle{background:var(--surface-2);color:var(--ink-2)}
.act-btn.danger{background:color-mix(in srgb,var(--chili) 12%,transparent);color:var(--chili)}
.pay-tag{font-size:.74rem;font-weight:700;color:var(--ink-3)}
.pay-tag.paid{color:var(--leaf)}

/* menu list */
.menu-list{display:grid;gap:12px}
.menu-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;animation:fadeUp .35s both}
.menu-row.inactive{opacity:.55}
.menu-row .info{flex:1 1 220px}
.menu-row .info b{font-size:.98rem}
.menu-row .info small{display:block;color:var(--ink-3);font-size:.78rem}
.slot-chips{display:flex;gap:5px;flex-wrap:wrap}
.slot-chips span{padding:3px 10px;border-radius:8px;background:var(--surface-2);font-size:.7rem;font-weight:700;color:var(--ink-2)}
.menu-row .price{font-weight:800;font-size:1.05rem;min-width:70px;text-align:right}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);transition:background .2s;flex:none}
.switch.on{background:var(--leaf)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.switch.on::after{left:23px}
.mini-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-size:.9rem;transition:transform .15s}
.mini-btn:hover{transform:translateY(-2px)}
.add-fab{position:fixed;right:28px;bottom:28px;padding:16px 26px;border-radius:99px;background:var(--primary);color:#fff;font-weight:800;font-size:.95rem;box-shadow:0 10px 28px color-mix(in srgb,var(--primary) 45%,transparent);transition:transform .15s;z-index:40}
.add-fab:hover{transform:translateY(-3px)}

/* earnings */
.chart{display:flex;align-items:end;gap:6px;height:150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:22px}
.chart .bar{flex:1;background:linear-gradient(180deg,var(--saffron),var(--primary));border-radius:6px 6px 2px 2px;min-height:4px;position:relative;transition:height .5s cubic-bezier(.32,.72,.31,1)}
.chart .bar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:8px;font-size:.7rem;font-weight:700;white-space:nowrap;z-index:5}
.pop-list{display:grid;gap:8px}
.pop-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:.9rem}
.pop-row .rank{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--primary)}
.pop-row b{flex:1}
.pop-row .cnt{color:var(--ink-3);font-weight:700;font-size:.8rem}

/* modal / misc */
.overlay{position:fixed;inset:0;background:rgba(20,10,5,.5);backdrop-filter:blur(3px);z-index:90;display:none}
.overlay.show{display:block}
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;overflow-y:auto}
.modal.show{display:grid}
.modal .box{width:min(520px,100%);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px 28px;box-shadow:var(--shadow-lg);animation:fadeUp .3s both;margin:auto}
.modal h3{font-size:1.4rem;margin-bottom:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:600;cursor:pointer}
.checks input{accent-color:var(--primary)}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{padding:13px 22px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.9rem;box-shadow:var(--shadow-lg);animation:fadeUp .3s both;max-width:90vw}
.empty{text-align:center;padding:60px 20px;color:var(--ink-2)}
.empty .big{font-size:3rem;margin-bottom:10px}
.skel{height:86px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border:1px solid var(--line)}
@keyframes shimmer{to{background-position:-200% 0}}
@media(max-width:820px){.shell.active{grid-template-columns:1fr}.sidebar{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;padding:8px;z-index:60;border-top:1px solid var(--line);border-right:none}.side-logo,.side-foot .theme-row{display:none}.side-link{flex-direction:column;gap:3px;font-size:.68rem;padding:8px 6px;flex:1;justify-content:center;text-align:center}.side-foot{margin:0;flex-direction:row;flex:1}.main{padding-bottom:110px}}
</style>
</head>
<body>

<!-- ── Login ── -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="mark">👨‍🍳</div>
    <h1>Kitchen Dashboard</h1>
    <p class="sub">Sign in to manage your orders, menu and earnings.</p>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="kitchen@example.com" autocomplete="email"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="primary-btn" id="loginBtn" onclick="App.login()">Sign in</button>
    <a class="ghost-link" href="/kitchen-register.html">New here? Register your kitchen →</a>
  </div>
</div>

<!-- ── Shell ── -->
<div class="shell" id="shell">
  <aside class="sidebar">
    <div class="side-logo"><span class="mark">🍛</span> Thali Plan</div>
    <button class="side-link active" data-view="orders" onclick="App.nav('orders')">📦 Orders</button>
    <button class="side-link" data-view="menu" onclick="App.nav('menu')">🍲 Menu</button>
    <button class="side-link" data-view="earnings" onclick="App.nav('earnings')">📈 Earnings</button>
    <button class="side-link" data-view="profile" onclick="App.nav('profile')">⚙️ Profile</button>
    <div class="side-foot">
      <button class="side-link theme-row" onclick="App.toggleTheme()">🌙 Theme</button>
      <button class="side-link" onclick="App.logout()">🚪 Sign out</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 id="pageTitle">Orders</h2>
      <span class="live-pill" id="livePill"><i></i><span id="liveTxt">Connecting…</span></span>
      <div class="right"><span style="font-weight:700;font-size:.9rem" id="kName"></span></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- ── Item modal ── -->
<div class="overlay" id="mOverlay" onclick="App.closeModal()"></div>
<div class="modal" id="itemModal">
  <div class="box">
    <h3 id="modalTitle">Add menu item</h3>
    <div class="field"><label>Name *</label><input id="fName" placeholder="e.g. Paneer Thali"></div>
    <div class="row2">
      <div class="field"><label>Price (₹) *</label><input id="fPrice" type="number" min="0" placeholder="120"></div>
      <div class="field"><label>Tier</label><select id="fTier"><option value="basic">Basic</option><option value="standard">Standard</option><option value="premium">Premium</option></select></div>
    </div>
    <div class="field"><label>Description</label><textarea id="fDesc" rows="2" placeholder="What makes it special?"></textarea></div>
    <div class="field"><label>Meal slots</label>
      <div class="checks">
        <label><input type="checkbox" value="Breakfast" class="fSlot"> 🌅 Breakfast</label>
        <label><input type="checkbox" value="Lunch" class="fSlot" checked> ☀️ Lunch</label>
        <label><input type="checkbox" value="Dinner" class="fSlot"> 🌙 Dinner</label>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>Calories (kcal)</label><input id="fCal" type="number" min="0" placeholder="450"></div>
      <div class="field"><label>Protein (g)</label><input id="fProtein" type="number" min="0" placeholder="18"></div>
    </div>
    <div class="field"><label>Tags (comma separated)</label><input id="fTags" placeholder="spicy, jain, high-protein"></div>
    <button class="primary-btn" id="saveItemBtn" onclick="App.saveItem()">Save item</button>
    <a class="ghost-link" href="#" onclick="App.closeModal();return false">Cancel</a>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
'use strict';
const API = '/api';
const NEXT = { placed:{to:'confirmed',label:'Confirm ✓'}, confirmed:{to:'preparing',label:'Start cooking 🔥'}, preparing:{to:'out_for_delivery',label:'Send out 🛵'}, out_for_delivery:{to:'delivered',label:'Delivered 🎉'} };
const STATUS_LABEL = { placed:'New', confirmed:'Confirmed', preparing:'Preparing', out_for_delivery:'On the way', delivered:'Delivered', cancelled:'Cancelled' };

const App = {
  token: localStorage.getItem('tpk_token'), kitchen: JSON.parse(localStorage.getItem('tpk_kitchen')||'null'),
  view:'orders', orders:[], menu:[], statusFilter:'active', editingId:null, ws:null, freshIds:new Set(),

  init() {
    const theme = localStorage.getItem('tp_theme'); if (theme) document.documentElement.dataset.theme = theme;
    if (this.token && this.kitchen) this.enter(); 
  },
  toggleTheme() { const el=document.documentElement; el.dataset.theme = el.dataset.theme==='dark'?'':'dark'; localStorage.setItem('tp_theme', el.dataset.theme); },

  /* ── auth ── */
  async login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    if (!email || !password) return this.toast('Enter email and password');
    const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const res = await fetch(API+'/auth/kitchen/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error||'Login failed');
      this.token = data.token; this.kitchen = data.kitchen;
      localStorage.setItem('tpk_token', this.token); localStorage.setItem('tpk_kitchen', JSON.stringify(this.kitchen));
      this.enter();
    } catch(e){ this.toast(e.message); }
    btn.disabled = false; btn.textContent = 'Sign in';
  },
  logout() { localStorage.removeItem('tpk_token'); localStorage.removeItem('tpk_kitchen'); location.reload(); },
  enter() {
    document.getElementById('loginView').style.display='none';
    document.getElementById('shell').classList.add('active');
    document.getElementById('kName').textContent = this.kitchen.name;
    this.nav('orders'); this.connectWS();
  },
  async authFetch(url, opts={}) {
    opts.headers = { ...(opts.headers||{}), 'Authorization':'Bearer '+this.token };
    const res = await fetch(url, opts);
    if (res.status === 401) { this.toast('Session expired — please sign in again'); setTimeout(()=>this.logout(), 1200); throw new Error('Unauthorized'); }
    return res;
  },

  /* ── nav ── */
  nav(v) {
    this.view = v;
    document.querySelectorAll('.side-link[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
    document.getElementById('pageTitle').textContent = {orders:'Orders',menu:'Menu',earnings:'Earnings',profile:'Profile'}[v];
    document.getElementById('content').innerHTML = '<div class="orders"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
    ({orders:()=>this.loadOrders(), menu:()=>this.loadMenu(), earnings:()=>this.loadEarnings(), profile:()=>this.renderProfile()})[v]();
  },

  /* ── orders ── */
  async loadOrders() {
    try { const res = await fetch(`${API}/orders/${this.kitchen.id}`); this.orders = await res.json(); }
    catch { this.orders = []; }
    this.renderOrders();
  },
  renderOrders() {
    if (this.view !== 'orders') return;
    const counts = { active:0 };
    this.orders.forEach(o => { counts[o.status]=(counts[o.status]||0)+1; if(!['delivered','cancelled'].includes(o.status)) counts.active++; });
    const filters = ['active','placed','preparing','out_for_delivery','delivered','cancelled'];
    const list = this.orders.filter(o => this.statusFilter==='active' ? !['delivered','cancelled'].includes(o.status) : o.status===this.statusFilter);
    const approval = this.kitchen.active===false ? `<div class="approval-note">⏳ Your kitchen is <b>awaiting admin approval</b>. You can set up your menu meanwhile — customers will see you once approved.</div>` : '';
    document.getElementById('content').innerHTML = approval + `
      <div class="tabs">${filters.map(f=>`<button class="tab ${this.statusFilter===f?'active':''}" onclick="App.setStatusFilter('${f}')">${f==='active'?'🔥 Active':STATUS_LABEL[f]} <span class="n">${counts[f]||0}</span></button>`).join('')}</div>
      <div class="orders" id="ordersList">${
        list.length ? list.map(o=>this.orderHTML(o)).join('') :
        `<div class="empty"><div class="big">🍂</div><b>No ${this.statusFilter==='active'?'active':STATUS_LABEL[this.statusFilter].toLowerCase()} orders right now.</b><br>New orders appear here instantly.</div>`}</div>`;
  },
  setStatusFilter(f){ this.statusFilter=f; this.renderOrders(); },
  orderHTML(o) {
    const items = Object.entries(o.itemsByMeal||{}).map(([meal,its]) =>
      `<div><span class="meal">${meal}:</span> ${(its||[]).map(i=>`${i.qty||1}× ${this.esc(i.name)}`).join(', ')}</div>`).join('');
    const next = NEXT[o.status];
    const t = new Date(o.placedAt); const time = t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + ' · ' + t.toLocaleDateString([], {day:'numeric',month:'short'});
    return `<div class="order-card ${this.freshIds.has(o.id)?'fresh':''}">
      <div class="who"><b>${this.esc(o.customerName||'Customer')}</b><small>#${this.esc(o.id)} · ${time}${o.customerMobile?' · 📞 '+this.esc(o.customerMobile):''}</small>
        ${o.notes?`<small>📝 ${this.esc(o.notes)}</small>`:''}</div>
      <div class="order-items">${items}</div>
      <div style="text-align:right"><b style="font-size:1.1rem">₹${(o.total||0).toFixed(0)}</b><br><span class="pay-tag ${o.paid?'paid':''}">${o.paid?'✓ PAID':String(o.paymentMethod||'cod').toUpperCase()}</span></div>
      <span class="badge ${o.status}">${STATUS_LABEL[o.status]||o.status}</span>
      <div class="order-actions">
        ${next?`<button class="act-btn" onclick="App.advance('${o.id}','${next.to}')">${next.label}</button>`:''}
        ${['placed','confirmed'].includes(o.status)?`<button class="act-btn danger" onclick="App.advance('${o.id}','cancelled', true)">✕</button>`:''}
      </div></div>`;
  },
  async advance(orderId, status, confirmFirst) {
    if (confirmFirst && !confirm('Cancel this order?')) return;
    try {
      const res = await this.authFetch(`${API}/orders/${orderId}/status`, {method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+this.token},body:JSON.stringify({status})});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error||'Update failed');
      const o = this.orders.find(x=>x.id===orderId); if (o) o.status = status;
      this.freshIds.delete(orderId);
      this.renderOrders();
      this.toast(`Order ${STATUS_LABEL[status].toLowerCase()} ✓`);
    } catch(e){ if(e.message!=='Unauthorized') this.toast(e.message); }
  },

  /* ── live ── */
  connectWS() {
    try {
      const proto = location.protocol==='https:'?'wss':'ws';
      this.ws = new WebSocket(`${proto}://${location.host}/ws`);
      this.ws.onopen = () => { document.getElementById('livePill').classList.add('on'); document.getElementById('liveTxt').textContent='Live'; };
      this.ws.onclose = () => { document.getElementById('livePill').classList.remove('on'); document.getElementById('liveTxt').textContent='Reconnecting…'; setTimeout(()=>this.connectWS(), 5000); };
      this.ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        const order = msg.order || msg.data || msg;
        if ((order.kitchenId||order.kitchen_id) !== this.kitchen.id) return;
        const oid = order.id || order.orderId;
        if (oid) this.freshIds.add(oid);
        this.beep(); this.toast('🔔 Order update received');
        if (this.view==='orders') this.loadOrders();
      };
    } catch {}
  },
  beep() {
    try { const ctx = new (window.AudioContext||window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.setValueAtTime(.12, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.4); o.start(); o.stop(ctx.currentTime+.4); } catch {}
  },

  /* ── menu ── */
  async loadMenu() {
    try { const res = await fetch(`${API}/kitchens/${this.kitchen.id}/menu`); this.menu = await res.json(); }
    catch { this.menu = []; }
    this.renderMenu();
  },
  renderMenu() {
    if (this.view!=='menu') return;
    document.getElementById('content').innerHTML = `
      <div class="menu-list">${
        this.menu.length ? this.menu.map(it=>`
        <div class="menu-row ${it.active===false?'inactive':''}">
          <div class="info"><b>${this.esc(it.name)}</b><small>${this.esc(it.description||'')}</small>
            <div class="slot-chips">${(it.slots||[]).map(s=>`<span>${s}</span>`).join('')}${it.tier?`<span>✦ ${this.esc(it.tier)}</span>`:''}${it.cal?`<span>🔥 ${it.cal}</span>`:''}</div></div>
          <span class="price">₹${parseFloat(it.price).toFixed(0)}</span>
          <button class="switch ${it.active!==false?'on':''}" title="Toggle availability" onclick="App.toggleItem(${it.id})"></button>
          <button class="mini-btn" title="Edit" onclick="App.openModal(${it.id})">✏️</button>
          <button class="mini-btn" title="Delete" onclick="App.deleteItem(${it.id})">🗑️</button>
        </div>`).join('') :
        `<div class="empty"><div class="big">🍲</div><b>Your menu is empty.</b><br>Add your first dish and start receiving orders!</div>`}</div>
      <button class="add-fab" onclick="App.openModal()">+ Add item</button>`;
  },
  openModal(itemId) {
    this.editingId = itemId || null;
    const it = itemId ? this.menu.find(m=>m.id===itemId) : null;
    document.getElementById('modalTitle').textContent = it ? 'Edit menu item' : 'Add menu item';
    document.getElementById('fName').value = it?it.name:'';
    document.getElementById('fPrice').value = it?parseFloat(it.price):'';
    document.getElementById('fTier').value = it?(it.tier||'basic'):'basic';
    document.getElementById('fDesc').value = it?(it.description||''):'';
    document.getElementById('fCal').value = it&&it.cal?it.cal:'';
    document.getElementById('fProtein').value = it&&it.protein?it.protein:'';
    document.getElementById('fTags').value = it&&it.tags?it.tags.join(', '):'';
    document.querySelectorAll('.fSlot').forEach(c => c.checked = it ? (it.slots||[]).includes(c.value) : c.value==='Lunch');
    document.getElementById('mOverlay').classList.add('show'); document.getElementById('itemModal').classList.add('show');
  },
  closeModal() { document.getElementById('mOverlay').classList.remove('show'); document.getElementById('itemModal').classList.remove('show'); },
  async saveItem() {
    const body = {
      name: document.getElementById('fName').value.trim(),
      price: parseFloat(document.getElementById('fPrice').value),
      tier: document.getElementById('fTier').value,
      description: document.getElementById('fDesc').value.trim(),
      cal: parseInt(document.getElementById('fCal').value)||0,
      protein: parseInt(document.getElementById('fProtein').value)||0,
      tags: document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean),
      slots: [...document.querySelectorAll('.fSlot:checked')].map(c=>c.value),
    };
    if (!body.name || !(body.price>=0)) return this.toast('Name and price are required');
    const btn = document.getElementById('saveItemBtn'); btn.disabled = true;
    try {
      const url = this.editingId ? `${API}/kitchens/${this.kitchen.id}/menu/${this.editingId}` : `${API}/kitchens/${this.kitchen.id}/menu`;
      const res = await this.authFetch(url, {method:this.editingId?'PUT':'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+this.token},body:JSON.stringify(body)});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error||'Save failed');
      this.closeModal(); this.toast(this.editingId?'Item updated ✓':'Item added 🎉'); this.loadMenu();
    } catch(e){ if(e.message!=='Unauthorized') this.toast(e.message); }
    btn.disabled = false;
  },
  async toggleItem(itemId) {
    try {
      const res = await this.authFetch(`${API}/kitchens/${this.kitchen.id}/menu/${itemId}/toggle`, {method:'PATCH',headers:{'Authorization':'Bearer '+this.token}});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error||'Toggle failed');
      const it = this.menu.find(m=>m.id===itemId); if (it) it.active = data.item.active;
      this.renderMenu();
    } catch(e){ if(e.message!=='Unauthorized') this.toast(e.message); }
  },
  async deleteItem(itemId) {
    if (!confirm('Delete this item permanently?')) return;
    try {
      const res = await this.authFetch(`${API}/kitchens/${this.kitchen.id}/menu/${itemId}`, {method:'DELETE',headers:{'Authorization':'Bearer '+this.token}});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error||'Delete failed');
      this.menu = this.menu.filter(m=>m.id!==itemId); this.renderMenu(); this.toast('Item deleted');
    } catch(e){ if(e.message!=='Unauthorized') this.toast(e.message); }
  },

  /* ── earnings ── */
  async loadEarnings() {
    let earn = null, ana = null;
    try { const r = await this.authFetch(`${API}/kitchens/${this.kitchen.id}/earnings`); earn = await r.json(); } catch {}
    try { const r = await fetch(`${API}/analytics/${this.kitchen.id}`); ana = await r.json(); } catch {}
    if (this.view!=='earnings') return;
    if (!earn) { document.getElementById('content').innerHTML = '<div class="empty"><div class="big">📈</div><b>Could not load earnings.</b></div>'; return; }
    const days = (ana&&ana.byDay)||[];
    const max = Math.max(...days.map(d=>parseFloat(d.revenue)), 1);
    document.getElementById('content').innerHTML = `
      <div class="stats">
        <div class="stat"><div class="lbl">Today</div><div class="val">₹${earn.today.toFixed(0)}</div><div class="hint">delivered orders</div></div>
        <div class="stat"><div class="lbl">This week</div><div class="val">₹${earn.week.toFixed(0)}</div><div class="hint">since Monday</div></div>
        <div class="stat"><div class="lbl">This month</div><div class="val">₹${earn.month.toFixed(0)}</div><div class="hint">running total</div></div>
        ${ana&&ana.summary?`<div class="stat"><div class="lbl">Avg order</div><div class="val">₹${parseFloat(ana.summary.avg_order_value).toFixed(0)}</div><div class="hint">${ana.summary.total_orders} orders · 30 days</div></div>`:''}
      </div>
      ${days.length?`<h3 style="margin-bottom:12px">Last 14 days</h3><div class="chart">${days.map(d=>`<div class="bar" style="height:${Math.max(4, parseFloat(d.revenue)/max*100)}%" data-tip="${new Date(d.day).toLocaleDateString([],{day:'numeric',month:'short'})} · ₹${parseFloat(d.revenue).toFixed(0)} · ${d.orders} orders"></div>`).join('')}</div>`:''}
      ${earn.popularItems&&earn.popularItems.length?`<h3 style="margin-bottom:12px">Top dishes</h3><div class="pop-list">${earn.popularItems.map((p,i)=>`<div class="pop-row"><span class="rank">${i+1}</span><b>${this.esc(p.name)}</b><span class="cnt">${p.count} sold</span></div>`).join('')}</div>`:''}`;
  },

  /* ── profile ── */
  renderProfile() {
    const k = this.kitchen;
    document.getElementById('content').innerHTML = `
      <div style="max-width:520px">
        <div class="field"><label>Kitchen name</label><input id="pName" value="${this.esc(k.name)}"></div>
        <div class="field"><label>Phone</label><input id="pPhone" placeholder="Contact number"></div>
        <div class="field"><label>Address</label><textarea id="pAddr" rows="2" placeholder="Full pickup address"></textarea></div>
        <div class="row2">
          <div class="field"><label>Opens at</label><input id="pOpen" type="time" value="07:00"></div>
          <div class="field"><label>Closes at</label><input id="pClose" type="time" value="22:00"></div>
        </div>
        <div class="field"><label>Kitchen photo</label><input id="pPhoto" type="file" accept="image/*"></div>
        <button class="primary-btn" id="profBtn" onclick="App.saveProfile()">Save profile</button>
      </div>`;
  },
  async saveProfile() {
    const btn = document.getElementById('profBtn'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const body = { name: document.getElementById('pName').value.trim(), phone: document.getElementById('pPhone').value.trim()||null,
        address: document.getElementById('pAddr').value.trim()||null, openingTime: document.getElementById('pOpen').value, closingTime: document.getElementById('pClose').value };
      const res = await this.authFetch(`${API}/kitchens/${this.kitchen.id}/profile`, {method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+this.token},body:JSON.stringify(body)});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error||'Save failed');
      this.kitchen.name = body.name; localStorage.setItem('tpk_kitchen', JSON.stringify(this.kitchen));
      document.getElementById('kName').textContent = body.name;
      const file = document.getElementById('pPhoto').files[0];
      if (file) {
        const fd = new FormData(); fd.append('photo', file);
        const pr = await this.authFetch(`${API}/kitchens/${this.kitchen.id}/photo`, {method:'POST',headers:{'Authorization':'Bearer '+this.token},body:fd});
        if (!pr.ok) throw new Error('Photo upload failed');
      }
      this.toast('Profile saved ✓');
    } catch(e){ if(e.message!=='Unauthorized') this.toast(e.message); }
    btn.disabled = false; btn.textContent = 'Save profile';
  },

  /* ── utils ── */
  toast(text) { const t=document.createElement('div'); t.className='toast'; t.textContent=text; document.getElementById('toasts').appendChild(t); setTimeout(()=>{t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300);},3200); },
  esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },
};
App.init();
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') App.login(); });
</script>
</body>
