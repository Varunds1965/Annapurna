<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Nutrition Profile — Thali Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#E85D2A;--primary-dark:#C94A1D;--saffron:#F4A825;--leaf:#3E8E5A;
  --bg:#FFF8F0;--surface:#FFFFFF;--ink:#2D1B12;--ink-2:#6B5748;--ink-3:#9C8B7D;
  --line:#F0E2D2;--shadow:0 4px 24px rgba(45,27,18,.08);--shadow-lg:0 12px 40px rgba(45,27,18,.14);
  --r:16px;--r-lg:24px;
}
[data-theme="dark"]{
  --bg:#171009;--surface:#211710;--ink:#F5EDE4;--ink-2:#C9B8A8;--ink-3:#8A7A6B;
  --line:#382A1E;--shadow:0 4px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
h1,h2,h3{font-family:'Fraunces',serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}

.page-header{padding:20px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:var(--surface)}
.page-header .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--saffron),var(--primary));display:grid;place-items:center;font-size:1.2rem;flex-shrink:0}
.page-header h1{font-size:1.15rem;font-weight:700}
.page-header .sub{font-size:.82rem;color:var(--ink-2)}
.back-link{margin-left:auto;font-size:.85rem;font-weight:600;color:var(--ink-2);text-decoration:none;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);transition:all .2s}
.back-link:hover{border-color:var(--primary);color:var(--primary)}

.wrap{max-width:640px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,4vw,24px) 100px}
.intro{margin-bottom:28px}
.intro h2{font-size:clamp(1.6rem,3.5vw,2.1rem);margin-bottom:8px}
.intro p{color:var(--ink-2);font-size:.98rem;max-width:52ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(20px,4vw,32px);box-shadow:var(--shadow)}
.field{margin-bottom:18px}
.field-row{display:flex;gap:14px}
.field-row .field{flex:1}
.field label{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:7px}
.field input,.field select{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:.98rem;outline:none;transition:border .2s,box-shadow .2s}
.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent)}

.chip-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.chip-row .chip{cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);font-size:.88rem;font-weight:600;color:var(--ink-2);transition:all .2s}
.chip-row .chip:hover{border-color:var(--primary)}
.chip-row .chip input{accent-color:var(--primary)}
.chip-row .chip:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}

.divider{height:1px;background:var(--line);margin:26px 0}
.section-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:12px}

.actions{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.primary-btn{width:100%;padding:16px;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;font-size:1rem;box-shadow:0 8px 24px color-mix(in srgb,var(--primary) 35%,transparent);transition:transform .15s,box-shadow .2s}
.primary-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px color-mix(in srgb,var(--primary) 45%,transparent)}
.primary-btn:disabled{opacity:.6;pointer-events:none}
.ghost-link{text-align:center;font-size:.88rem;color:var(--ink-2);font-weight:600;text-decoration:none}
.ghost-link:hover{color:var(--primary)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:99px;font-size:.9rem;font-weight:600;box-shadow:var(--shadow-lg);transition:transform .3s cubic-bezier(.32,.72,.31,1);z-index:200;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

.loading-gate{max-width:640px;margin:60px auto;text-align:center;color:var(--ink-2)}
</style>
</head>
<body>

<header class="page-header">
  <div class="mark">🥗</div>
  <div>
    <h1>Your Nutrition Profile</h1>
    <div class="sub">Thali Plan</div>
  </div>
  <a class="back-link" href="customer.html">← Back to menu</a>
</header>

<div id="gate" class="loading-gate">Loading…</div>

<div class="wrap" id="formWrap" style="display:none">
  <div class="intro">
    <h2>Tell us about you 🥗</h2>
    <p>This helps us recommend thalis that actually match what your body needs — the more accurate this is, the better your recommendations.</p>
  </div>

  <div class="card">
    <div class="section-label">About you</div>
    <div class="field-row">
      <div class="field"><label>Age</label><input id="pfAge" type="number" min="1" max="120" placeholder="Years"></div>
      <div class="field"><label>Gender</label><select id="pfGender"><option value="">Prefer not to say</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Weight (kg)</label><input id="pfWeight" type="number" min="1" step="0.1" placeholder="e.g. 65"></div>
      <div class="field"><label>Height (cm)</label><input id="pfHeight" type="number" min="1" step="0.1" placeholder="e.g. 170"></div>
    </div>

    <div class="divider"></div>

    <div class="section-label">Your goal</div>
    <div class="field">
      <label>What are you working towards?</label>
      <select id="pfGoal">
        <option value="maintain">Maintain weight</option>
        <option value="weight_loss">Weight loss</option>
        <option value="weight_gain">Weight gain</option>
        <option value="muscle_gain">Build muscle</option>
      </select>
    </div>
    <div class="field">
      <label>Diet preference</label>
      <select id="pfDietPref"><option value="veg">Vegetarian</option><option value="nonveg">Non-Vegetarian</option></select>
    </div>

    <div class="divider"></div>

    <div class="section-label">Nutrition needs</div>
    <div class="field">
      <label>Any nutrient deficiencies? (select all that apply)</label>
      <div class="chip-row" id="pfDeficiencies" autocomplete="off">
        <label class="chip"><input type="checkbox" value="Protein" autocomplete="off"> Protein</label>
        <label class="chip"><input type="checkbox" value="Calcium" autocomplete="off"> Calcium</label>
        <label class="chip"><input type="checkbox" value="Iron" autocomplete="off"> Iron</label>
        <label class="chip"><input type="checkbox" value="Vitamin D" autocomplete="off"> Vitamin D</label>
        <label class="chip"><input type="checkbox" value="B12" autocomplete="off"> B12</label>
      </div>
    </div>
    <div class="field">
      <label>Foods you dislike (comma separated, optional)</label>
      <input id="pfDislikes" placeholder="e.g. mushroom, bitter gourd">
    </div>

    <div class="actions">
      <button class="primary-btn" id="saveBtn" onclick="saveProfile()">Save preferences</button>
      <a class="ghost-link" href="customer.html" id="skipLink">Skip for now</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin + '/api';
const token = localStorage.getItem('tp_token');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { ...options, headers });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

async function loadExistingProfile() {
  if (!token) {
    // No session at all — send back to the main page to sign in first.
    window.location.href = 'customer.html';
    return;
  }
  try {
    const data = await api('/auth/me');
    const c = data.user;
    if (c.age) document.getElementById('pfAge').value = c.age;
    if (c.weight) document.getElementById('pfWeight').value = c.weight;
    if (c.height) document.getElementById('pfHeight').value = c.height;
    if (c.gender) document.getElementById('pfGender').value = c.gender;
    if (c.goal) document.getElementById('pfGoal').value = c.goal;
    if (c.diet_pref) document.getElementById('pfDietPref').value = c.diet_pref;
    if (c.disliked_foods) document.getElementById('pfDislikes').value = c.disliked_foods;
    (c.deficiencies || []).forEach(d => {
      const cb = document.querySelector(`#pfDeficiencies input[value="${d}"]`);
      if (cb) cb.checked = true;
    });
    // If they already have a profile, "Skip" doesn't make sense — swap it for "Cancel".
    if (c.age) document.getElementById('skipLink').textContent = 'Cancel';
  } catch (e) {
    toast(e.message);
  }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('formWrap').style.display = 'block';
}

async function saveProfile() {
  const deficiencies = [...document.querySelectorAll('#pfDeficiencies input:checked')].map(c => c.value);
  const dislikedFoods = document.getElementById('pfDislikes').value.trim();
  const body = {
    age: parseInt(document.getElementById('pfAge').value) || null,
    weight: parseFloat(document.getElementById('pfWeight').value) || null,
    height: parseFloat(document.getElementById('pfHeight').value) || null,
    gender: document.getElementById('pfGender').value || null,
    goal: document.getElementById('pfGoal').value || null,
    dietPref: document.getElementById('pfDietPref').value || null,
    dislikedFoods: dislikedFoods || null,
    deficiencies,
  };
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await api('/auth/customer/profile', { method: 'PUT', body: JSON.stringify(body) });
    localStorage.setItem('tp_profile_seen', '1');
    toast('Saved! Taking you back to your menu 🎯');
    setTimeout(() => { window.location.href = 'customer.html'; }, 700);
  } catch (e) {
    toast(e.message);
    btn.disabled = false; btn.textContent = 'Save preferences';
  }
}

loadExistingProfile();
</script>
</body>
</html>
